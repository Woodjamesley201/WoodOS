name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build, test and package
        env:
          WOODOS_KEYSTORE_BASE64: ${{ secrets.WOODOS_KEYSTORE_BASE64 }}
          WOODOS_STORE_PASSWORD: ${{ secrets.WOODOS_STORE_PASSWORD }}
          WOODOS_KEY_ALIAS: ${{ secrets.WOODOS_KEY_ALIAS }}
          WOODOS_KEY_PASSWORD: ${{ secrets.WOODOS_KEY_PASSWORD }}
        run: |
          if [ -n "$WOODOS_KEYSTORE_BASE64" ]; then
            echo "$WOODOS_KEYSTORE_BASE64" | base64 -d > "$HOME/woodos-release.jks"
            export WOODOS_STORE_FILE="$HOME/woodos-release.jks"
          fi
          ./gradlew test assembleDebug assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk WoodOS-debug.apk
          mv app/build/outputs/apk/release/app-release.apk WoodOS-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WoodOS-debug.apk
            WoodOS-release.apk
          generate_release_notes: true
