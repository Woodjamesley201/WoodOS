name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew test assembleDebug assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk WoodOS-debug.apk
          mv app/build/outputs/apk/release/app-release.apk WoodOS-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WoodOS-debug-apk
          path: WoodOS-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: WoodOS-release-apk
          path: WoodOS-release.apk
